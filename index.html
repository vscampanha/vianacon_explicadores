<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VianaCon 2026 Explicadores</title>
    <link rel="stylesheet" href="style/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">VianaCon</p>
          <h1>Explicadores</h1>
        </div>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark mode">
          ☀
        </button>
      </header>

      <main class="container">
        <section class="search-container">
          <h2>Search Games</h2>
          <div class="search">
            <input
              type="text"
              id="searchBar"
              placeholder="Search by game name"
              onkeyup="searchGames()"
            />
          </div>

          <div class="difficulty-filter-group">
            <label for="difficultyFilter">Dificuldade</label>
            <div class="difficulty-filters" aria-label="Filter by game difficulty">
              <button class="difficulty-filter filter-default active" type="button" data-filter="all">All</button>
              <button class="difficulty-filter filter-light-green" type="button" data-filter="0-1">0-1</button>
              <button class="difficulty-filter filter-green" type="button" data-filter="1-2">1-2</button>
              <button class="difficulty-filter filter-yellow" type="button" data-filter="2-3">2-3</button>
              <button class="difficulty-filter filter-orange" type="button" data-filter="3-4">3-4</button>
              <button class="difficulty-filter filter-red" type="button" data-filter="4-5">4-5</button>
            </div>
          </div>

          <div class="category-filter-group">
            <label for="categoryFilter">Sugestões</label>
            <select id="categoryFilter" class="category-select" aria-label="Filter by suggestion category">
              <option value="all" selected>All</option>
            </select>
          </div>
        </section>

        <div id="results" aria-live="polite"></div>
      </main>
    </div>

    <script src="js/script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
  </body>
</html>
